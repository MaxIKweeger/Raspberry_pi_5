[package]
name = "a76probe"
version = "0.1.0"
edition = "2021"
description = "Microarchitecture explorer for the Cortex-A76 cores of the Raspberry Pi 5"
build = "build.rs"
license = "Apache-2.0"
repository = "https://github.com/MaxIKweeger/Raspberry_pi_5"

[lib]
name = "a76probe"
path = "src/lib.rs"

[[bin]]
name = "a76probe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
strip = false
